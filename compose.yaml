name: autodnevnik

services:
  web:
    build:
      context: ./backend
      dockerfile: docker/php/Dockerfile
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:80"
    volumes:
      - ./backend:/var/www/html
    environment:
      APP_NAME: AutoDnevnik
      APP_ENV: ${APP_ENV:-local}
      APP_DEBUG: "false"
      APP_URL: ${APP_URL:-http://localhost:8080}
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: ${DB_DATABASE:-autodnevnik}
      DB_USERNAME: ${DB_USERNAME:-autodnevnik}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      SESSION_DRIVER: file
      VIN_API_BASE_URL: ${VIN_API_BASE_URL:-https://vpic.nhtsa.dot.gov/api}
      VIN_API_TIMEOUT_SECONDS: ${VIN_API_TIMEOUT_SECONDS:-10}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.4
    ports:
      - "127.0.0.1:${DB_FORWARD_PORT:-3307}:3306"
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-autodnevnik}
      MYSQL_USER: ${DB_USERNAME:-autodnevnik}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

volumes:
  db-data:
